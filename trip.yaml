# Roteiro Aruba — fevereiro 2027
# Datas: Aruba 11–18/02 (chegada às 4h do dia 11), Panamá 18–20/02, volta pro Brasil 20/02.
# Atenção: no GitHub grátis o site é público. Só bairro/região, nada de endereço exato ou nº de voo.

title: "Aruba"
subtitle: "7 dias de praia, rochas e pôr do sol"
dates: {start: 2027-02-11}
language: pt-BR
timezone: America/Aruba
units: {temp: C, distance: km, waves: ft}

home:
  name: "Hospedagem em Oranjestad (a definir)"
  address: "Oranjestad, Aruba"
  lat: 12.5240
  lon: -70.0290
  desc: "Base da viagem em Oranjestad, a capital. A proposta da Camila é um quarto no CottonSuites; ainda está em aberto. De carro, Eagle Beach fica a uns 10 min e Palm Beach a uns 15."

places:
  - id: aeroporto
    name: "Aeroporto Queen Beatrix (AUA), Aruba"
    lat: 12.5014
    lon: -70.0152
    type: travel
    desc: "Chegada às 4h do dia 11 e saída pro Panamá no dia 18. Retirada e devolução do carro alugado."
    model: airport
  - id: tram
    name: "Bonde de Oranjestad, Main Street"
    lat: 12.5197
    lon: -70.0362
    type: sight
    desc: "Bondinho elétrico grátis que sobe e desce a Main Street, a rua de compras do centro, saindo perto do terminal de cruzeiros."
    tip: "O horário muda conforme os navios no porto e o último sai às 17h. Ir de manhã num dia de semana."
  - id: aloe
    name: "Aruba Aloe Museum & Factory, Hato"
    lat: 12.5411
    lon: -70.0375
    type: sight
    desc: "Fábrica de aloe vera com museu e tour guiado grátis de uns 25 min. Em dia de semana dá pra ver a produção."
    tip: "Abre seg a sex 8h30–16h e sáb 9h–12h. Fecha domingo."
  - id: casibari
    name: "Casibari Rock Formation, Aruba"
    lat: 12.5296
    lon: -69.9941
    type: hike
    desc: "Rochas gigantes no meio da ilha, com caminho e escadinhas até o topo e vista de 360°."
  - id: ayo
    name: "Ayo Rock Formation, Aruba"
    lat: 12.5313
    lon: -69.9707
    type: hike
    desc: "Pedras enormes com petróglifos dos povos originários e trilhas curtas entre as rochas. Grátis, aberto durante o dia."
    tip: "Ir antes das 10h ou depois das 16h, por causa do calor."
  - id: bushiribana
    name: "Bushiribana Gold Mill Ruins, Aruba"
    lat: 12.5570
    lon: -69.9890
    type: sight
    desc: "Ruínas de pedra de uma usina de ouro de 1872, na costa norte, de frente pro mar bravo. Grátis."
  - id: andicuri
    name: "Andicuri Beach, Aruba"
    lat: 12.5375
    lon: -69.9555
    type: beach
    desc: "Praia selvagem da costa norte, perto da antiga Natural Bridge. Só pra ver e fotografar: o mar é forte."
  - id: eagle
    name: "Eagle Beach, Aruba"
    lat: 12.5509
    lon: -70.0592
    type: beach
    desc: "A praia mais famosa da ilha: areia branca larga, mar calmo e as árvores fofoti. Tem palapas (sombra) grátis."
  - id: palm
    name: "Palm Beach, Aruba"
    lat: 12.5737
    lon: -70.0450
    type: beach
    desc: "A praia dos resorts: mar calmo, beach bars e muito movimento."
  - id: pelican-pier
    name: "Pelican Pier, Palm Beach, Aruba"
    lat: 12.5755
    lon: -70.0470
    type: sight
    desc: "Píer de onde sai o barco do pôr do sol."
  - id: arashi
    name: "Arashi Beach, Aruba"
    lat: 12.6097
    lon: -70.0518
    type: beach
    desc: "Praia preferida dos locais, perto do farol, com mar calmo, beach bar e snorkel na ponta."
  - id: catalina
    name: "Boca Catalina, Aruba"
    lat: 12.6030
    lon: -70.0510
    type: beach
    desc: "O melhor snorkel saindo da areia: água rasa e clara, cheia de peixe. Levar máscara."
  - id: farol
    name: "California Lighthouse, Aruba"
    lat: 12.6146
    lon: -70.0510
    type: sight
    desc: "O farol na ponta norte da ilha, com vista das dunas e do mar."
    model: lighthouse
  - id: mangel-halto
    name: "Mangel Halto, Pos Chiquito, Aruba"
    lat: 12.4645
    lon: -69.9715
    type: beach
    desc: "Lagoa de água rasa entre mangues, ótima pra snorkel, caiaque e stand up."
  - id: zeerovers
    name: "Zeerovers, Savaneta, Aruba"
    lat: 12.4512
    lon: -69.9590
    type: food
    desc: "Peixe e camarão fritos na hora, num píer de pescadores. Barato e o almoço mais famoso entre os locais."
  - id: baby-beach
    name: "Baby Beach, San Nicolas, Aruba"
    lat: 12.4180
    lon: -69.8820
    type: beach
    desc: "Lagoa rasa e calminha no extremo sul, a uns 40 min de carro de Oranjestad."
    tip: "O ônibus não vai mais até lá: só de carro."
  - id: san-nicolas
    name: "San Nicolas, Aruba"
    lat: 12.4330
    lon: -69.9070
    type: sight
    desc: "A cidade dos murais de arte de rua, no caminho de volta da Baby Beach."

