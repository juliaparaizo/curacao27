# Roteiro Curaçao — fevereiro 2027
# DATA PROVISÓRIA: troque dates.start pela data de chegada em Curaçao assim que a passagem for comprada.
# Atenção: no GitHub grátis o site é público. Só bairro/região, nada de endereço exato ou nº de voo.

title: "Curaçao"
subtitle: "10 noites de praia, trilha e pôr do sol"
dates: {start: 2027-02-12}
language: pt-BR
units: {temp: C, distance: km, waves: ft}

home:
  name: "Elements Hotel & Shops"
  address: "Hendrikplein, Punda, Willemstad, Curaçao"
  lat: 12.1062
  lon: -68.9327
  desc: "Base da viagem em Punda, com café da manhã incluso e rooftop com piscina."

places:
  - id: aeroporto
    name: "Aeroporto de Curaçao (Hato)"
    lat: 12.1889
    lon: -68.9598
    type: travel
    desc: "Chegada e saída. Retirada e devolução do carro alugado."
  - id: queen-emma
    name: "Queen Emma Bridge, Willemstad"
    lat: 12.1077
    lon: -68.9357
    type: sight
    desc: "A ponte flutuante que liga Punda a Otrobanda e abre pra passagem dos navios."
    model: bridge
  - id: handelskade
    name: "Handelskade, Willemstad"
    type: sight
    desc: "A fachada colorida do cartão-postal de Willemstad."
  - id: otrobanda
    name: "Otrobanda, Willemstad"
    type: sight
    desc: "O outro lado da ponte: ruelas, murais e a vista da Handelskade."
  - id: pietermaai
    name: "Pietermaai, Willemstad"
    type: sight
    desc: "Bairro mais charmoso pra sair à noite, cheio de casarões restaurados."
  - id: la-boheme
    name: "La Boheme, Columbusstraat, Willemstad"
    type: food
    desc: "Jantar de chegada, a pé do hotel."
  - id: kome
    name: "Kome, Pietermaai, Willemstad"
    type: food
    desc: "Cozinha criativa num casarão de Pietermaai. Brunch no fim de semana."
  - id: gouverneur
    name: "De Gouverneur, De Rouvilleweg, Otrobanda"
    lat: 12.1064
    lon: -68.9373
    type: food
    desc: "Restaurante, bar e rooftop num casarão histórico na beira d'água de Otrobanda, de frente pra Handelskade e a ponte flutuante. Pratos locais e internacionais."
    tip: "Reservar mesa na varanda, que tem a melhor vista."
  - id: fensi
    name: "Fensi, Penstraat, Willemstad"
    lat: 12.1014
    lon: -68.9222
    type: food
    desc: "Fine dining em Pietermaai, clima intimista e boa carta de vinhos."
  - id: zanzibar
    name: "Zanzibar, Jan Thiel, Curaçao"
    type: food
    desc: "Beach bar em Jan Thiel. À noite só vale no sábado, quando tem festa."
  - id: papagayo
    name: "Papagayo Beach Club, Jan Thiel, Curaçao"
    lat: 12.0772
    lon: -68.8800
    type: food
    desc: "Beach club em Jan Thiel, ótimo pro pôr do sol."
  - id: punda-vibes
    name: "Punda Vibes, Punda, Willemstad"
    lat: 12.1063
    lon: -68.9340
    type: sight
    desc: "Toda quinta à noite: Punda vira festa de rua, com música ao vivo, feirinha e comida. Termina com fogos às 20h15."
  - id: mundo-bizarro
    name: "Mundo Bizarro, Nieuwestraat, Pietermaai"
    lat: 12.1037
    lon: -68.9265
    type: food
    desc: "Bar e restaurante cubano em Pietermaai, com música ao vivo. Depois dos fogos de quinta tem salsa, mambo e merengue, clima de Havana Velha. Dá pra ir a pé do hotel."
  - id: daaibooi
    name: "Daaibooi Beach, Curaçao"
    type: beach
    desc: "Praia pública, que não fecha: a melhor das três pro pôr do sol."
  - id: porto-mari
    name: "Porto Mari, Curaçao"
    type: beach
    desc: "Duplo recife: o melhor snorkel do dia."
  - id: cas-abao
    name: "Cas Abao Beach, Curaçao"
    type: beach
    desc: "Água muito azul e estrutura completa. Fecha no fim da tarde (começam a liberar a praia por volta das 18h30)."
  - id: klein-curacao
    name: "Klein Curaçao"
    type: sight
    desc: "Ilha desabitada de areia branca, com farol e tartarugas. Passeio de barco com a Kezia."
    model: lighthouse
  - id: christoffel
    name: "Christoffelberg, Curaçao"
    type: hike
    desc: "372 m, o ponto mais alto da ilha. Cerca de 1h30 de subida."
    tip: "Começar antes das 7h, antes do calor. Tênis fechado e muita água."
  - id: shete-boka
    name: "Shete Boka National Park, Curaçao"
    type: hike
    desc: "Costa selvagem, com as ondas explodindo nas rochas da Boka Tabla."
  - id: playa-jeremi
    name: "Playa Jeremi, Curaçao"
    type: beach
    desc: "Praia tranquila pra descansar depois das trilhas."
  - id: kabritenburg
    name: "Seru Kabritu, Caracasbaai, Curaçao"
    lat: 12.0695
    lon: -68.8618
    type: hike
    desc: "Trilha curta (~1h ida e volta) no morro da península de Caracasbaai, com vista de Spanish Water."
    tip: "Ir cedo, antes do windsurf."
  - id: sup-curacao
    name: "SUP Curacao, Caracasbaaiweg, Curaçao"
    lat: 12.0815
    lon: -68.8735
    type: surf
    desc: "Aula de windsurf pra iniciante em Spanish Water (~1h30). Tem tour de SUP pelos mangues também."
    tip: "Precisa saber nadar."
  - id: atv
    name: "Hato, Curaçao"
    type: sight
    desc: "Quadriciclo ATV off-road com a Kezia. Ponto de encontro a confirmar."
  - id: piskado
    name: "Playa Piskado, Curaçao"
    lat: 12.3615
    lon: -69.1545
    type: beach
    desc: "Nadar com tartarugas perto do píer dos pescadores. Ir cedo."
  - id: kalki
    name: "Playa Kalki, Westpunt, Curaçao"
    lat: 12.3756
    lon: -69.1578
    type: beach
    desc: "A \"Alice in Wonderland\" da ilha, com corais em formato de cogumelo. Ótima pra snorkel, com centro de mergulho na praia."
  - id: fort-nassau
    name: "Fort Nassau, Fort Nassauweg, Willemstad"
    lat: 12.1154
    lon: -68.9269
    type: food
    desc: "Restaurante dentro de um forte de 1797, no alto do morro, com vista de Willemstad e da costa. Frutos do mar, carnes e boa carta de vinhos."
    tip: "Chegar antes do pôr do sol pra ver a vista. Reservar."
  - id: kenepa-grandi
    name: "Playa Kenepa Grandi, Curaçao"
    type: beach
    desc: "O cartão-postal da ilha."
  - id: kenepa-chiki
    name: "Playa Kenepa Chiki, Curaçao"
    type: beach
    desc: "A versão menor e mais tranquila da Grote Knip."
  - id: kokomo
    name: "Kokomo Beach, Curaçao"
    type: beach
    desc: "Beach club com o balanço dentro da água."
  - id: mambo
    name: "Mambo Beach, Curaçao"
    type: beach
    desc: "Praia urbana com beach clubs e lojinhas."
  - id: renaissance-mall
    name: "Renaissance Mall, Willemstad"
    type: sight
    desc: "Compras de última hora antes do aeroporto."

days:
  - title: "Chegada"
    area: "Willemstad"
    items:
      - {type: travel, text: "Voo Panamá → Curaçao (Copa) e retirada do carro alugado", place: aeroporto}
