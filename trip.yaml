      - {time: "14:00", text: "Baby Beach", place: baby-beach}
      - {time: "17:00", text: "Murais de San Nicolas no caminho de volta", place: san-nicolas}
  - title: "Bonde de Oranjestad e barco do pôr do sol"
    area: "Oranjestad e Palm Beach"
    items:
      - {time: "09:30", text: "Bonde grátis pela Main Street e centro de Oranjestad", place: tram}
      - {time: "13:00", text: "Tarde em Palm Beach", place: palm}
      - {time: "17:00", text: "Barco do pôr do sol saindo do Pelican Pier", place: pelican-pier}
  - title: "Dia livre"
    area: "Livre"
