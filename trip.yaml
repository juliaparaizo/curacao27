      - {time: "10:00", text: "Tour grátis na fábrica de aloe", place: aloe}
      - {time: "11:15", text: "Ruínas de Bushiribana", place: bushiribana}
      - {time: "11:45", text: "Costa de Andicuri", place: andicuri}
      - {time: "15:00", text: "Arashi Beach", place: arashi}
      - {time: "17:30", text: "Pôr do sol no California Lighthouse", place: farol}
  - title: "Arikok de 4x4 e a Conchi"
    area: "Arikok e Eagle · sem carro"
    items:
      - {time: "08:00", text: "Jeep 4x4 no Parque Arikok, com busca na hospedagem", place: arikok}
      - {time: "09:30", text: "Banho e snorkel na piscina natural Conchi", place: conchi}
      - {time: "16:00", text: "Fim de tarde em Eagle Beach", place: eagle}
  - title: "Bonde e catamarã com tartarugas"
    area: "Oranjestad e costa oeste · sem carro"
    items:
      - {time: "09:30", text: "Bonde grátis pela Main Street", place: tram}
      - {time: "14:30", text: "Saída do catamarã da Spronk", place: spronk}
      - {time: "15:30", text: "Snorkel em Boca Catalina", place: catalina}
      - {time: "16:30", text: "Tartarugas em Tres Trapi, pôr do sol e churrasco a bordo", place: tres-trapi}
  - title: "Palm Beach"
    area: "Palm Beach · sem carro"
    items:
      - {time: "10:00", text: "Ônibus até Palm Beach: dia na praia", place: palm}
  - title: "Eagle Beach"
    area: "Eagle Beach · sem carro"
    items:
      - {time: "10:00", text: "Último dia inteiro em Eagle Beach", place: eagle}
  - title: "Saída pro Panamá"
    area: "Oranjestad"
    items:
