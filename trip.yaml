      - {time: "14:00", text: "Caminhada pelos murais de San Nicolas", place: san-nicolas}
      - {time: "16:00", text: "Fim de tarde em Mangel Halto", place: mangel-halto}
  - title: "Carro: rochas, aloe e ponta norte"
