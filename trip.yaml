      - {time: "10:30", text: "Andicuri e a costa norte", place: andicuri}
      - {time: "11:15", text: "Ruínas da usina de ouro de Bushiribana", place: bushiribana}
      - {time: "14:00", text: "Tour grátis na fábrica de aloe", place: aloe}
      - {time: "16:30", text: "Fim de tarde em Eagle Beach", place: eagle}
