      - {text: "Confirmar se a tarifa do Elements inclui as taxas", who: julia}
      - {text: "Querem incluir o café da manhã do hotel?", who: cliente}
      - {text: "Tudo bem dividir uma cama king? (senão, procurar quarto com duas camas)", who: cliente}
      - {text: "Confirmar e reservar o Elements (só depois da passagem: a tarifa não é reembolsável)", who: julia}
