# Página "Planejamento" do site: apresentação de cada parte da viagem + checklist.
# Pra marcar uma tarefa como feita pra todo mundo, troque done: false por done: true e faça o commit.
# Atenção: o site é público. Nada de valores negociados, telefone, nº de reserva ou documento aqui.

title: "Planejamento da viagem"
lead: "Tudo o que está fechado, por que escolhemos cada coisa e o que falta resolver até o embarque."
people:
  julia: "Julia"
  cliente: "Isabella"

sections:
  - id: hotel
    kicker: "Hospedagem · 7 noites em Aruba (+ a noite do dia 10)"
    title: "Hospedagem em Oranjestad"
    lead: "Ainda em aberto. A Camila sugeriu um quarto no CottonSuites, em Oranjestad. Como o voo pousa às 4h do dia 11, a reserva precisa começar no dia 10 (ou ter check-in antecipado combinado), senão elas ficam sem onde ir de madrugada."
    why:
      - title: "Bem avaliado"
        text: "Nota 4,85 com 20 avaliações, anfitrião Superhost e estacionamento grátis pro carro alugado."
      - title: "Bem localizado"
        text: "Fica em Oranjestad, a capital: perto do aeroporto, do centro e do bonde, e a uns 10 min de carro de Eagle Beach."
      - title: "O que pesar"
        text: "É um quarto privativo, sem cozinha. Isso pesa no orçamento de comida, porque não dá pra tomar café em casa nem montar a bolsa térmica das praias."
      - title: "Datas erradas no link"
        text: "O link que a Camila mandou está com 11 a 18 de janeiro. O certo é 10 a 18 de fevereiro."
    facts:
      - {label: "Datas", value: "10 a 18/02 (8 noites)"}
      - {label: "Tipo", value: "Quarto privativo, sem cozinha"}
      - {label: "Status", value: "A decidir"}
    buttons:
      - {text: "Ver no Airbnb (datas certas)", url: "https://www.airbnb.com.br/rooms/1316925446641138925?check_in=2027-02-10&check_out=2027-02-18&adults=2", primary: true}

  - id: transporte
    kicker: "Transporte · carro alugado no aeroporto"
    title: "Carro alugado"
    lead: "A recomendação é alugar o carro no próprio aeroporto e ficar com ele os 7 dias, retirando na chegada e devolvendo na hora de embarcar pro Panamá. Dá pra se virar de ônibus e táxi na parte dos hotéis, mas metade do roteiro (as rochas, a costa norte, Mangel Halto, Zeerovers e Baby Beach) fica fora do caminho do ônibus."
    why:
      - title: "As melhores partes ficam longe"
        text: "O ônibus da orla (linha 10) passa a cada 15 min de dia, mas só cobre Oranjestad, Eagle e Palm Beach. A Baby Beach, por exemplo, não tem mais ônibus."
      - title: "Táxi sai caro"
        text: "Só o táxi do aeroporto até Eagle Beach custa uns US$ 18 a 22. Com ida e volta todo dia, o carro se paga."
      - title: "Liberdade de horário"
        text: "Dá pra chegar nas rochas cedinho, antes do calor, e ficar na praia até o pôr do sol."
      - title: "Fácil de dirigir"
        text: "A ilha é pequena, as estradas são boas e se dirige do mesmo lado do Brasil."
    facts:
      - {label: "7 dias", value: "≈ US$ 447 + US$ 67 de gasolina"}
      - {label: "Por pessoa", value: "≈ US$ 223,50 + US$ 33,50"}
      - {label: "Retirada", value: "Aeroporto (AUA), dia 11"}
      - {label: "Precisa", value: "CNH + cartão de crédito"}
    days_title: "Dias com carro"
    days:
      - {day: 1, text: "Retirada no aeroporto → hospedagem → Eagle Beach"}
      - {day: 2, text: "Casibari, Ayo, Bushiribana e a fábrica de aloe"}
      - {day: 3, text: "Arashi, Boca Catalina e o farol"}
      - {day: 4, text: "Mangel Halto, Zeerovers, Baby Beach e San Nicolas"}
      - {day: 5, text: "Oranjestad, Palm Beach e o Pelican Pier"}
      - {day: 8, text: "Devolução no aeroporto"}
    tips_title: "Pra alugar"
    notes:
      - "Os balcões do aeroporto abrem por volta das 7h (a Enterprise abre às 7h, a Sixt às 9h). Como o pouso é às 4h, dá pra esperar o balcão abrir ou ir de táxi pra hospedagem e combinar a entrega do carro lá: a Enterprise entrega em qualquer ponto da ilha sem custo, se combinado antes."
      - "Precisa de CNH válida e de cartão de crédito físico no nome de quem vai dirigir. As locadoras seguram um caução no cartão (na National, US$ 300 + o valor do aluguel)."
      - "A idade mínima costuma ser 21 anos, e abaixo de 25 tem taxa de motorista jovem."
      - "Carro comum dá conta de tudo do roteiro. Só o Parque Arikok e a Natural Pool pedem 4x4, e eles não estão no plano."
      - "Não deixar nada à vista no carro nas praias."
    buttons:
      - {text: "Ver o roteiro dia a dia", url: "roteiro.html", primary: true}

  - id: passeios
    kicker: "Passeios · quase tudo grátis"
    title: "Passeios"
    lead: "A maior parte do que elas querem fazer em Aruba é de graça e dá pra fazer de carro, no próprio ritmo. O único passeio pago é o barco do pôr do sol."
    tours:
      - name: "Barco do pôr do sol (Pelican Adventures)"
        day: 5
        status: "A comprar"
        text: "2h de catamarã pela costa dos hotéis, com open bar e petiscos, saindo às 17h30 do Pelican Pier, em Palm Beach. Nota 4,8 com mais de 1.200 avaliações. ≈ US$ 70 a 82 por pessoa, conforme o site."
        tip: "Sai seg, qua, sex, sáb e dom. No roteiro está na segunda (dia 5). Cancelamento grátis até 24h antes."
        options:
          - {name: "Mais barato", when: "≈ US$ 60", info: "Sunset Sail saindo do Moomba Beach."}
          - {name: "Mais completo", when: "US$ 112–123", info: "Palm Pleasure da De Palm, ou o Pelican com jantar de 3 pratos no píer depois."}
      - name: "Casibari"
        day: 2
        status: "Grátis"
        text: "Rochas gigantes no meio da ilha, com caminho e escadinhas fáceis até o topo e vista da ilha inteira."
      - name: "Trilha nas rochas de Ayo"
        day: 2
        status: "Grátis"
        text: "Trilhas curtas entre pedras enormes, com petróglifos dos povos originários. Aberto durante o dia, sem horário fixo."
        tip: "Ir antes das 10h ou depois das 16h por causa do calor. Casibari e Ayo ficam pertinho uma da outra."
      - name: "Ruínas de Bushiribana"
        day: 2
        status: "Grátis"
        text: "Ruínas de pedra de uma usina de ouro de 1872, na costa norte, com o mar batendo forte. No caminho fica a praia de Andicuri, pra foto."
      - name: "Fábrica de aloe"
        day: 2
        status: "Grátis"
        text: "Tour guiado de uns 25 min pelo museu e pela fábrica de aloe vera em Hato, com lojinha no final. Em dia de semana dá pra ver a produção."
        tip: "Seg a sex, 8h30 às 16h, e sáb, 9h às 12h. Fecha domingo."
      - name: "Bonde de Oranjestad"
        day: 5
        status: "Grátis"
        text: "Bondinho elétrico que sobe e desce a Main Street, a rua de compras do centro, saindo perto do terminal de cruzeiros. Não precisa de bilhete."
        tip: "O horário muda conforme os navios no porto, e o último sai às 17h. Por isso ficou de manhã, num dia de semana."

  - id: praias
    kicker: "Beach hopping · as melhores praias"
    title: "Praias"
    lead: "As praias escolhidas, agrupadas por região pra não perder tempo no carro. A costa oeste tem mar calmo; a costa norte é bonita, mas o mar é bravo e não é pra nadar."
    tours:
      - name: "Eagle Beach"
        day: 1
        status: "Dias 1, 2 e 7"
        text: "A melhor da ilha: areia branca larga, mar calmo e as árvores fofoti do cartão-postal. Tem palapas (sombra) grátis. Melhor praia pro pôr do sol."
      - name: "Arashi"
        day: 3
        status: "Dia 3"
        text: "A preferida dos locais, perto do California Lighthouse, com mar calmo e beach bar."
      - name: "Boca Catalina"
        day: 3
        status: "Dia 3"
        text: "O melhor snorkel saindo da areia, em água rasa e clara. Levar máscara ou alugar."
      - name: "Mangel Halto"
        day: 4
        status: "Dia 4"
        text: "Lagoa rasa entre mangues, ótima pra snorkel, caiaque e stand up. Fica pertinho do Zeerovers."
      - name: "Zeerovers (almoço)"
        day: 4
        status: "Dia 4"
        text: "Peixe e camarão fritos na hora num píer de pescadores, a preço local. Abre de ter a dom, das 11h às 21h, e só aceita dinheiro."
        tip: "No fim de semana a fila é grande: chegar perto das 11h30."
      - name: "Baby Beach"
        day: 4
        status: "Dia 4"
        text: "Lagoa rasinha e calma no extremo sul, a uns 40 min de carro. Na volta, os murais de San Nicolas."
      - name: "Palm Beach"
        day: 5
        status: "Dias 5 e 7"
        text: "A praia dos resorts, com beach bars e muito movimento. É de onde sai o barco do pôr do sol."

  - id: panama
    kicker: "Panamá · 2 noites, na volta"
    title: "Panamá"
    lead: "Na volta de Aruba elas param 2 noites na Cidade do Panamá, com base em Casco Viejo e um bate-volta pras ilhas de San Blas no dia do meio."
    facts:
      - {label: "Datas", value: "18 a 20/02"}
      - {label: "Base", value: "Casco Viejo"}
      - {label: "Moeda", value: "Dólar americano"}
    tours:
      - name: "Chegada e noite em Casco Viejo"
        status: "Qui 18/02"
        text: "Check-in em Casco Viejo e um fim de tarde sem pressa no centro histórico."
        options:
          - {name: "Pôr do sol no Paseo Esteban Huertas", when: "fim de tarde", info: "Calçadão em cima da antiga muralha, com vista do skyline e dos navios esperando pra entrar no Canal. Ali perto, mulheres Guna vendem as molas bordadas."}
          - {name: "Plaza de Francia e Plaza de la Independencia", when: "a pé", info: "As praças principais, com a Catedral Basílica Santa María la Antigua."}
          - {name: "Jantar panamenho", when: "noite", info: "Fonda Lo Que Hay, famoso pelos patacones, ou frutos do mar na La Pulpería."}
          - {name: "Dormir cedo", when: "noite", info: "A busca pro San Blas é às 5h."}
      - name: "Bate-volta pra San Blas · confirmado"
        status: "Sex 19/02"
        text: "4 ilhas em um dia, em grupo pequeno (até 15 pessoas): a ilha remota de Misdub, a piscina natural cheia de estrelas-do-mar, Perro Grande com almoço (peixe, frango ou vegetariano) e uma bebida, caiaque e stand up, e o naufrágio de Perro Chico pra snorkel. A busca é no hotel, na Cidade do Panamá, entre 5h e 5h45. São 2h30 de 4x4 até o porto de Cartí, e a volta é à noite. Guia fala inglês e espanhol. Nota 4,3 com 742 avaliações. US$ 145 por pessoa + US$ 22 da taxa de entrada Guna Yala, paga lá."
        link: {text: "Comprar no GetYourGuide", url: "https://www.getyourguide.com/san-blas-islands-l123270/from-panama-city-4-san-blas-islands-day-trip-with-lunch-t246297/?partner_id=X5GTDRF&utm_medium=online_publisher"}
        tip: "Com só 2 noites não sobra dia reserva: se o mar não deixar sair, o passeio é cancelado. Por isso vale comprar com cancelamento grátis (até 24h antes)."
      - name: "Canal e voo de volta"
        status: "Sáb 20/02"
        text: "Depende do horário do voo pro Brasil:"
        options:
          - {name: "Eclusas de Miraflores", when: "8h às 18h", info: "Ver os navios passando pelo Canal, com mirante e IMAX. ≈ US$ 17. Fica a uns 20 min de Uber de Casco Viejo e no caminho do aeroporto."}
          - {name: "Ceviche no Mercado de Mariscos", when: "almoço", info: "Mercado de peixe no começo da Cinta Costera, com barracas de ceviche baratas."}
          - {name: "Café Gesha e chapéu-panamá", when: "a pé", info: "Café Unido e Victor's Hats, em Casco Viejo."}
        tip: "Se o voo do dia 20 for cedo, Miraflores pode entrar no fim de tarde do dia 18, dependendo da hora que pousarem."

  - id: dicas
    kicker: "Antes de ir · documentos, dinheiro e segurança"
    title: "Antes de ir"
    lead: "O que precisa estar pronto antes do embarque e o que é bom saber pra chegar tranquila. Regras de entrada mudam: vale reconferir com a companhia aérea uns dias antes."
    tips:
      - title: "Documentos pra Aruba"
        items:
          - "Passaporte válido durante toda a viagem. O ideal é ter 6 meses de validade. RG não vale."
          - "Brasileiro não precisa de visto pra turismo."
          - "Preencher o ED Card online, que é obrigatório. Os detalhes estão no cartão ao lado."
          - "Levar no celular, ou impresso, a reserva da hospedagem e a passagem de saída de Aruba."
      - title: "ED Card + taxa de US$ 20"
        items:
          - "É o formulário de entrada de Aruba, obrigatório pra quem chega de avião. Sem ele aprovado, a companhia pode não deixar embarcar."
          - "Só pode ser preenchido nos 7 dias antes da viagem."
          - "O formulário é grátis, mas junto se paga a Sustainability Fee de US$ 20 por pessoa, no cartão."
          - "Cada uma preenche e paga o seu. Se errar algum dado, tem que fazer um novo (não dá pra editar)."
          - "Só no site oficial, edcardaruba.aw."
        links:
          - {text: "Preencher no site oficial", url: "https://edcardaruba.aw/"}
      - title: "Vacina de febre amarela"
        items:
          - "Aruba pede o Certificado Internacional de Vacinação (CIVP) contra febre amarela pra brasileiros."
          - "A vacina tem que ser tomada pelo menos 10 dias antes da viagem. É grátis no posto de saúde."
          - "O certificado sai pelo app Meu SUS Digital ou pelo gov.br e vale pra vida toda. A carteirinha amarela comum não vale."
        links:
          - {text: "Emitir o certificado (gov.br)", url: "https://www.gov.br/pt-br/servicos/obter-o-certificado-internacional-de-vacinacao-e-profilaxia"}
      - title: "Chegada às 4h"
        items:
          - "A hospedagem precisa estar reservada desde o dia 10, ou com check-in de madrugada combinado com o anfitrião."
          - "Os balcões de aluguel de carro abrem por volta das 7h. Táxi do aeroporto até a região de Eagle Beach sai uns US$ 18 a 22."
      - title: "Panamá (stopover na volta)"
        items:
          - "Brasileiro não precisa de visto pra turismo."
          - "O Panamá não pede a vacina de febre amarela pra quem fica na Cidade do Panamá. Ela é recomendada pra San Blas, e como elas já vão tomar por causa de Aruba, fica coberto."
          - "O dólar americano é a moeda do dia a dia."
          - "Levar notas pequenas: notas de 50 e 100 são olhadas com desconfiança."
          - "Uber funciona na cidade. Táxi não tem taxímetro: combinar o preço antes de entrar."
          - "Casco Viejo tem policiamento e é tranquilo. Evitar El Chorrillo (bairro vizinho) e Calidonia à noite. À noite, ir de Uber."
      - title: "Dinheiro em Aruba"
        items:
          - "A moeda é o florim arubano (AWG), mas o dólar americano é aceito em praticamente todo lugar. Não precisa trocar dinheiro."
          - "Cartão passa quase em tudo. Levar um pouco de dólar em notas pequenas pro que é só em dinheiro, como o Zeerovers."
      - title: "Saúde e sol"
        items:
          - "A água da torneira é potável, vem de dessalinização."
          - "O sol é muito forte e o vento engana: protetor, chapéu e água sempre, principalmente nas rochas."
          - "Seguro viagem não é obrigatório, mas é muito recomendado."
      - title: "Segurança"
        items:
          - "Aruba é uma ilha tranquila. O problema mais comum é furto em carro e na praia."
          - "Não deixar nada à vista no carro."
          - "Na costa norte (Andicuri, Bushiribana) o mar é forte: só olhar e fotografar."
          - "Emergência: 911."

