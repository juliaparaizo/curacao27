  fx: 5.75
  fx_note: "Dólar comercial a R$ 5,51 (9/11/2026) + IOF e spread do cartão"
  people: 2
  target_brl: 20000
  target_label: "Meta da Isabella por pessoa, com passagem"
  groups:
    - name: "Curaçao"
      items:
        - {name: "Elements Hotel · Premier King · 10 noites", status: cotado, usd_total: 1555.20, note: "Tarifa não reembolsável, sem café. Falta confirmar se inclui taxas."}
        - {name: "Café da manhã no Elements (10 dias)", status: cotado, usd_pp: 200, note: "US$ 20 por dia, por pessoa."}
        - {name: "Klein Curaçao + transporte do hotel", status: cotado, usd_pp: 167, note: "Miss Ann US$ 150 + US$ 17. Mermaid sai US$ 164 e Blue Finn US$ 159, já com transporte."}
        - {name: "Quadriciclo ATV + transporte", status: cotado, usd_pp: 138, note: "US$ 118 individual + US$ 20 de transporte. Dividindo o mesmo quadriciclo cai pra US$ 108,50."}
        - {name: "Aula de windsurf em grupo (SUP Curaçao)", status: cotado, usd_pp: 52, note: "1h30 de aula."}
        - {name: "Carro alugado (10 dias, Bruna)", status: cotado, usd_total: 500, note: "US$ 50 por dia, retirada e devolução no aeroporto."}
        - {name: "Gasolina", status: estimativa, usd_total: [40, 70], note: "~450 km no roteiro todo. A gasolina custa ~XCG 2 por litro (≈ US$ 1,15)."}
        - {name: "Estacionamento e seguro extra do carro", status: estimativa, usd_pp: [10, 40], note: "Na rua em frente ao hotel: ~US$ 5,60 por dia útil, grátis à noite e domingo. Seguro: confirmar com a Bruna."}
        - {name: "Entradas de praias e parques", status: estimativa, usd_pp: [60, 90]}
        - {name: "Almoços e jantares (10 dias)", status: estimativa, usd_pp: [600, 900], note: "Varia muito com os restaurantes escolhidos. Levar comida do mercado na bolsa térmica pras praias reduz bastante."}
    - name: "Panamá · 3 noites, antes de Curaçao"
