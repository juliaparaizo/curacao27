        - {name: "Klein Curaçao", status: cotado, usd_pp: 159, note: "Blue Finn com transporte. Miss Ann sai US$ 167 e Mermaid US$ 164. De carro, dá pra ir direto ao píer e economizar o transporte."}
        - {name: "Entradas de praias e parques", status: estimativa, usd_pp: [50, 80]}
        - {name: "Comida (10 dias)", status: estimativa, usd_pp: [350, 450], note: "Café em casa, bolsa térmica do mercado nas praias e restaurante à noite, alternando caros e baratos."}
