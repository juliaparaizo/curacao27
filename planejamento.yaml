# Página "Planejamento" do site: apresentação de cada parte da viagem + checklist.
# Pra marcar uma tarefa como feita pra todo mundo, troque done: false por done: true e faça o commit.
# Atenção: o site é público. Nada de valores negociados, telefone, nº de reserva ou documento aqui.

title: "Planejamento da viagem"
lead: "Tudo o que está fechado, por que escolhemos cada coisa e o que falta resolver até o embarque."
people:
  julia: "Julia"
  cliente: "Isabella"

sections:
  - id: hotel
    kicker: "Hospedagem · 10 noites"
    title: "Elements Hotel & Shops"
    lead: "Um hotel boutique no coração de Punda, o centro histórico de Willemstad. É a melhor base da ilha pra quem quer sair a pé à noite e chegar rápido nas praias de dia."
    why:
      - title: "Tudo a pé"
        text: "A Handelskade colorida, a ponte flutuante e o mercado ficam a poucos minutos andando. Pietermaai, o bairro dos melhores restaurantes, fica logo ao lado."
      - title: "Rooftop com piscina de borda infinita"
        text: "O Cascada, no terraço, tem piscina, drinks e tapas com vista da cidade e do mar. É onde a gente fecha os dias mais tranquilos."
      - title: "Boutique e premiado"
        text: "São só 43 quartos, num 4 estrelas com estilo, e não num resort gigante. Embaixo tem uma praça com 3 restaurantes e lojinhas."
      - title: "Quarto amplo e moderno"
        text: "De 25 a 31 m², com cama king, mesa de trabalho e vista do pátio ou da ponte Queen Juliana."
    facts:
      - {label: "Onde", value: "Hendrikplein, Punda"}
      - {label: "Noites", value: "10"}
      - {label: "Quarto", value: "Premier King (1 cama king)"}
      - {label: "Café da manhã", value: "Opcional · US$ 20/dia"}
    buttons:
      - {text: "Ver o hotel e reservar", url: "https://www.elementscuracao.com", primary: true}
      - {text: "Ver no mapa", url: "index.html#lugar-home"}

  - id: transporte
    kicker: "Transporte · carro alugado"
    title: "Carro alugado"
    lead: "Em Curaçao as praias mais bonitas ficam longe do centro, o transporte público não chega nelas e não tem Uber. Por isso a viagem é de carro alugado pros 10 dias, com a Bruna, retirando e devolvendo no aeroporto."
    why:
      - title: "Bem mais barato"
        text: "O carro sai US$ 50 por dia. Um tour de motorista por várias praias custa US$ 400 por dia (de 2 a 4 pessoas)."
      - title: "Liberdade de horário"
        text: "Os tours de motorista acabam às 17h. De carro dá pra ficar na praia até o pôr do sol e ir jantar à noite."
      - title: "Fácil de dirigir"
        text: "Dirige-se do mesmo lado do Brasil. Nas praias o estacionamento é grátis ou barato."
      - title: "Chegada e saída resolvidas"
        text: "Retira o carro assim que pousa e devolve no aeroporto no dia de ir embora."
    facts:
      - {label: "Fornecedora", value: "Bruna"}
      - {label: "10 dias", value: "US$ 500 (US$ 50/dia)"}
      - {label: "Retirada", value: "Aeroporto (CUR)"}
      - {label: "Precisa", value: "CNH + cartão de crédito"}
    days_title: "Dias com carro"
    days:
      - {day: 1, text: "Retirada no aeroporto → Elements"}
      - {day: 2, text: "Píer do Klein Curaçao (saída 6h30)"}
      - {day: 4, text: "Cas Abao, Porto Mari e Daaibooi (pôr do sol)"}
      - {day: 6, text: "Christoffel, Shete Boka e Playa Jeremi (saída 6h)"}
      - {day: 7, text: "Kabritenburg, SUP Curaçao, Papagayo e Zanzibar à noite"}
      - {day: 8, text: "Piskadó, Kalki e Kenepa"}
      - {day: 10, text: "Kokomo e Fort Nassau (pôr do sol)"}
      - {day: 11, text: "Renaissance Mall → devolução no aeroporto"}
    tips_title: "Pra alugar"
    notes:
      - "Precisa de CNH válida e de cartão de crédito físico no nome de quem vai dirigir (débito não serve)."
      - "Algumas locadoras aceitam só a CNH; outras pedem a Permissão Internacional pra Dirigir (PID). Tirar a PID no Detran evita surpresa."
      - "A idade mínima costuma ser 21 anos. Abaixo de 25, algumas cobram taxa de motorista jovem."
      - "O seguro básico vem com franquia alta: vale a proteção extra ou checar se o cartão já cobre."
      - "A gasolina é vendida em galões e os postos são mais raros no oeste: abastecer de dia e devolver cheio."
      - "Nunca deixar nada à vista no carro nas praias."
      - "No hotel: estacionamento na rua, em frente. É pago de segunda a sábado, das 8h às 18h (XCG 1 por hora, ou XCG 10 ≈ US$ 5,60 o dia todo). À noite, domingo e feriado é grátis. Paga no parquímetro (moeda), com cartão pré-pago vendido na recepção ou pelo app (parking.cw)."
      - "Se quiser vaga garantida, o Pietermaai Parking, do lado do hotel, cobra US$ 2 a primeira hora, US$ 1,25 cada hora extra e US$ 20 o pernoite. Funciona das 6h à meia-noite."
    buttons:
      - {text: "Ver o roteiro dia a dia", url: "roteiro.html", primary: true}

  - id: passeios
    kicker: "Passeios · com a Kezia, guia brasileira"
    title: "Passeios"
    lead: "Os passeios de barco e de aventura saem com a Kezia, guia brasileira que mora na ilha. Ela organiza tudo em português. Em alguns passeios, o guia do operador fala inglês e espanhol. A maioria tem busca nos hotéis centrais, e o Elements é um deles."
    tours:
      - name: "Klein Curaçao"
        day: 2
        status: "No roteiro"
        text: "Ilha desabitada de areia branca, com farol e tartarugas. Tem três barcos à escolha:"
        options:
          - {name: "Miss Ann (iate)", when: "seg, ter, qui e sex", info: "1h de navegação. Tem estrutura na ilha (banheiro, ducha, cadeiras, guarda-sol), café da manhã, churrasco e snorkel guiado."}
          - {name: "Mermaid (barco)", when: "todo dia menos quinta", info: "2h de navegação. Tem boa estrutura na ilha, café da manhã, churrasco e snorkel."}
          - {name: "Blue Finn (catamarã)", when: "todo dia", info: "Clima mais animado, com open bar a partir de 12h30. Não tem estrutura própria na ilha, usa os quiosques públicos."}
        tip: "Cai numa segunda, dia em que os três barcos saem."
      - name: "Quadriciclo ATV"
        day: 5
        status: "No roteiro"
        text: "Off-road de 3h pelo lado oeste: plantação de Aloe Vera, uma caverna antiga com vista panorâmica e o Noordkant, onde as ondas batem nas pedras. Sai às 9h ou às 14h, todo dia."
        tip: "Ir de tênis fechado e evitar roupa branca."
      - name: "Barco pro pôr do sol"
        status: "Extra"
        text: "Das 17h às 19h30, pela Bahia Espanhola até a baía de Santa Anna, com petiscos e open bar. Sai seg, qua, sex e sáb."
      - name: "Costa Oeste: praias e Blue Room"
        status: "Extra"
        text: "Um dia inteiro de barco com parada no Kokomo, no Cas Abao e na gruta Blue Room, vendo as praias do oeste pelo mar. Sai ter, qui e sáb."
      - name: "Sea Trek"
        status: "Extra"
        text: "Caminhada no fundo do mar, com capacete, entre corais e peixes. Não precisa saber mergulhar. Sai de ter a sáb."
      - name: "Tuk tuk por Willemstad"
        status: "Extra"
        text: "Tour de 1h ou 2h por Punda e Otrobanda, com busca no hotel. Boa opção pro dia 2, se não quiser andar."

  - id: restaurantes
    kicker: "Onde comer"
    title: "Restaurantes"
    lead: "Indicações de quem já foi, encaixadas por bairro pra não perder tempo no trânsito. Vale reservar com antecedência."
    list:
      - {name: "La Boheme", where: "Punda", day: 1, maps: "La Boheme restaurant Willemstad Curaçao"}
      - {name: "Kome", where: "Pietermaai", day: 3, maps: "Kome restaurant Pietermaai Curaçao"}
      - {name: "De Gouverneur", where: "Otrobanda, vista da Handelskade", day: 4, maps: "Gouverneur de Rouville restaurant Curaçao"}
      - {name: "Fensi", where: "Pietermaai", day: 6, maps: "Fensi restaurant Pietermaai Curaçao"}
      - {name: "Papagayo Beach Club", where: "Jan Thiel, pôr do sol", day: 7, maps: "Papagayo Beach Club Jan Thiel Curaçao"}
      - {name: "Zanzibar", where: "Jan Thiel, sábado à noite (festa)", day: 7, maps: "Zanzibar Beach Restaurant Jan Thiel Curaçao"}
      - {name: "James", where: "Indicação da amiga", day: 2}
      - {name: "Mundo Bizarro", where: "Pietermaai, quinta à noite (salsa)", day: 5, maps: "Mundo Bizarro Pietermaai Curaçao"}
      - {name: "Fort Nassau", where: "No alto do morro, pôr do sol", day: 10, maps: "Fort Nassau restaurant Curaçao"}

  - id: panama
    kicker: "Panamá · 3 noites antes de Curaçao"
    title: "Panamá"
    lead: "O stopover da Copa é grátis por até 15 dias. Elas param 3 noites na Cidade do Panamá antes de seguir pra Curaçao, com base em Casco Viejo e um bate-volta pras ilhas de San Blas."
    facts:
      - {label: "Datas", value: "11 a 14/02 (proposta)"}
      - {label: "Base", value: "Casco Viejo"}
      - {label: "Moeda", value: "Dólar americano"}
    tours:
      - name: "Chegada e Casco Viejo"
        status: "Qui 11/02"
        text: "Chegada pela Copa, check-in e fim de tarde no centro histórico: Plaza de Francia, Catedral e um rooftop pra jantar."
      - name: "Bate-volta pra San Blas"
        status: "Sex 12/02"
        text: "Ilhas de areia branca no território Guna Yala, com piscina natural e snorkel. A busca no hotel é entre 5h e 5h45: vai de 4x4 até o porto de Cartí e de lá de lancha entre as ilhas. Volta por volta das 19h. Os tours costumam incluir almoço e a taxa de entrada."
        tip: "Ficou no segundo dia de propósito: se o mar não deixar sair, dá pra passar pro sábado."
      - name: "Canal do Panamá e cidade"
        status: "Sáb 13/02"
        text: "Eclusas de Miraflores (8h às 18h, ≈ US$ 17 com IMAX), Calzada de Amador ou Cinta Costera no fim de tarde e a última noite em Casco Viejo."
        tip: "Quer trocar? Gamboa (barco até a Isla de los Monos) e a comunidade Emberá também cabem nesse dia."
      - name: "Voo pra Curaçao"
        status: "Dom 14/02"
        text: "Voo curto da Copa e a viagem segue em Curaçao."

  - id: dicas
    kicker: "Antes de ir · documentos, dinheiro e segurança"
    title: "Antes de ir"
    lead: "O que precisa estar pronto antes do embarque e o que é bom saber pra chegar tranquila. Regras de entrada mudam: vale reconferir com a companhia aérea uns dias antes."
    tips:
      - title: "Documentos pra Curaçao"
        items:
          - "Passaporte válido durante toda a viagem. O ideal é ter 6 meses de validade. RG não vale."
          - "Brasileiro não precisa de visto pra turismo de até 90 dias."
          - "Preencher o Cartão de Imigração Digital (DI Card), que é obrigatório. Os detalhes estão no cartão ao lado."
          - "Levar no celular, ou impresso, a reserva do hotel e a passagem de volta. Também podem pedir pra comprovar que tem dinheiro pra estadia."
      - title: "Cartão de Imigração Digital (DI Card)"
        items:
          - "É obrigatório pra todo visitante estrangeiro, inclusive bebês e crianças, que fica de 1 a 90 noites. Substituiu o antigo cartão de papel (ED card)."
          - "Só pode ser preenchido nos 7 dias antes do embarque pra Curaçao, até 1 hora antes do voo."
          - "É grátis e só vale o preenchido no portal oficial. Site que cobra taxa não é oficial."
          - "Depois de enviar, chega um PDF por e-mail (ou pra baixar). Ele tem que ser mostrado no check-in da companhia aérea e na imigração, no celular ou impresso."
          - "Cada uma preenche o seu."
        links:
          - {text: "Preencher no portal oficial", url: "https://dicardcuracao.com/portal"}
      - title: "Vacina de febre amarela"
        items:
          - "Curaçao pede o Certificado Internacional de Vacinação (CIVP) contra febre amarela."
          - "A vacina tem que ser tomada pelo menos 10 dias antes da viagem."
          - "O certificado sai pelo app Meu SUS Digital ou pelo gov.br. A carteirinha amarela comum não vale."
        links:
          - {text: "Emitir o certificado (gov.br)", url: "https://www.gov.br/pt-br/servicos/obter-o-certificado-internacional-de-vacinacao-e-profilaxia"}
      - title: "Panamá (stopover na ida)"
        items:
          - "Brasileiro não precisa de visto pra turismo."
          - "Desde 2023 o Panamá não pede a vacina de febre amarela pra quem fica só na Cidade do Panamá. Ela é recomendada pra San Blas e pras comunidades Emberá, e como elas já vão tomar por causa de Curaçao, fica coberto."
          - "O dólar americano é a moeda do dia a dia. O balboa vale o mesmo que o dólar."
      - title: "Dinheiro em Curaçao"
        items:
          - "A moeda oficial é o florim caribenho (XCG), que substituiu o florim antilhano em 2025. O câmbio é fixo: US$ 1 = XCG 1,79."
          - "O dólar é aceito em quase todo lugar, mas o troco vem em florim e a conta da loja costuma sair um pouco pior."
          - "Visa e Mastercard passam em quase tudo, e Amex menos. Pagar no cartão em florim costuma sair mais barato. Por aproximação, o limite costuma ser de XCG 100."
          - "Caixa eletrônico cobra taxa: melhor sacar poucas vezes, em valores maiores."
      - title: "Saúde"
        items:
          - "A água da torneira é potável, vem de dessalinização."
          - "Levar repelente: tem mosquito e doenças transmitidas por ele na região."
          - "O sol é forte o ano todo: protetor, chapéu e água sempre, principalmente nas trilhas."
          - "Seguro viagem não é obrigatório, mas é muito recomendado."
          - "Emergência médica: Curaçao Medical Center (CMC), aberto 24h."
      - title: "Segurança"
        items:
          - "As áreas turísticas são tranquilas. O problema mais comum é furto."
          - "Não deixar nada no carro nas praias. Deixar o porta-luvas aberto mostra que está vazio."
          - "À noite, ficar em lugares movimentados: Punda, Pietermaai, Jan Thiel e Mambo. Evitar praia e lugar isolado depois que escurece."
          - "Táxi oficial tem placa começando com TX e não tem taxímetro: combinar o preço antes de entrar."
          - "No aeroporto, nunca deixar a mala sozinha nem levar pacote pra ninguém."
      - title: "Dia de praia"
        items:
          - "Em Curaçao é muito comum levar uma bolsa térmica com comida e bebida do mercado pra passar o dia na praia."
          - "Ajuda bastante no orçamento: dá pra deixar os restaurantes pros jantares."
          - "Vale comprar uma bolsa térmica barata no primeiro dia e passar no mercado na véspera dos dias de praia."
      - title: "Noite"
        items:
          - "Quinta: Punda Vibes, com música na rua e fogos às 20h15. Depois, salsa no Mundo Bizarro, em Pietermaai."
          - "Sábado: noite de festa no Zanzibar, em Jan Thiel. Nos outros dias, à noite, ele é mais parado."
          - "Pôr do sol: Papagayo Beach Club (Jan Thiel), Daaibooi e Fort Nassau."
          - "Baladas indicadas por quem mora lá: Liv e Emporio. O Emporio tem DJ e abre de terça a sábado."
          - "Pra voltar de madrugada, usar o app 24-7 Taxi em vez de dirigir."
      - title: "Táxi e apps"
        items:
          - "Não tem Uber em Curaçao."
          - "A alternativa é o app 24-7 Taxi Curaçao, com táxis licenciados: chama pelo app, acompanha o carro no GPS e o preço é fixo por km, sem taxímetro."
          - "Paga ao chegar, em dinheiro (florim ou dólar) ou no cartão, com 3% de taxa. Aceita Apple Pay."
          - "Também dá pra pedir pelo WhatsApp ou telefone: +5999 844 9247."
          - "Baixar o app e criar a conta ainda no Brasil, com Wi-Fi."
        links:
          - {text: "Baixar o app 24-7 Taxi", url: "https://247taxi.cw/download-app/"}
      - title: "Telefones de emergência"
        items:
          - "Polícia e bombeiros: 911"
          - "Ambulância: 912"
          - "Guarda costeira: 913"
          - "Polícia turística: 917"
      - title: "Tomada e energia"
        items:
          - "A rede é de 127 V e as tomadas são no padrão americano (A/B), às vezes europeu (C/F). O plugue brasileiro precisa de adaptador."
          - "O quarto do Elements tem tomadas de 220–240 V. Mesmo assim, levar um adaptador universal."

