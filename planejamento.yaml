        - {name: "Canal do Panamá (Miraflores)", status: cotado, usd_pp: 17.22, note: "Entrada pra estrangeiro, com IMAX."}
        - {name: "Bate-volta pra San Blas", status: estimativa, usd_pp: [146, 170], note: "Tours em grupo de ~US$ 146 a 170 com transporte, almoço e a taxa Guna Yala (US$ 22). Falta escolher o operador."}
